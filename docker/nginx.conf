# JURISCAN-AI reverse proxy: serves the built SPA and forwards the API
# (including WebSockets) to the backend container.

# WebSocket-aware Connection header: "upgrade" only when the client actually
# requested an upgrade, plain keep-alive otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Must be at least the backend MAX_UPLOAD_SIZE_MB (25) plus overhead.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Baseline browser hardening for the SPA.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API and WebSocket traffic. "backend" is the compose service name.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived WebSocket connections must not be dropped by idle
        # timeouts. The backend's own frame-activity guards still apply.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed, immutable static assets.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header in a location clears inherited server-level headers,
        # so repeat the security headers here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # SPA fallback: every non-file route renders index.html client-side.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
